{% extends "base.html" %}

{% block content %}
<main>
    {% for p in posts %}
      <section>
        <h2><a href="/blog/{{ p.slug }}">{{ p.title }}</a></h2>
        <small>{{ p.date }}</small>
        <p>{{ p.excerpt }}</p>
        <p><a href="/blog/{{ p.slug }}">Read more →</a></p>
      </section>
      <hr>
    {% endfor %}
</main>
{% endblock %}
